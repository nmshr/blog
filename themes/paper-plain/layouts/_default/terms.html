{{ define "main" }}
  <header class="list-header">
    <h1>{{ .Title }}</h1>
  </header>
  <ul class="terms">
    {{ range .Data.Terms.Alphabetical }}
      <li>
        <a href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }}</a>
        <span class="terms-count">({{ .Count }})</span>
      </li>
    {{ else }}
      <li>No terms yet.</li>
    {{ end }}
  </ul>
{{ end }}
