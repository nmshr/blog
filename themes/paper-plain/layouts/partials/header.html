<header class="site-header">
  {{ with .Site.Menus.main }}
    <nav class="site-nav">
      {{ range . }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
  {{ end }}
  <div class="site-title">
    <a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
  </div>
</header>
